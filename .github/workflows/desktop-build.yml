name: Desktop Build

# Phase 6B: hosted runners now produce the full desktop distributables from an exact commit.
# Windows builds the NSIS installer from the exact smoke-validated win-unpacked tree; macOS
# builds the DMG and ZIP from the exact smoke-validated bundle content.
# Still no tag, no GitHub Release, no signing and no notarization. The update feed metadata the
# packaged app needs is produced and verified here, but this workflow publishes nothing.
on:
  push:
    branches:
      - feat/v0.4-desktop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: windows-build (Windows Server 2022 / x64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # `ref: ${{ github.sha }}` deliberately checks out a detached HEAD. NovaWing inspects the
      # working copy as a normal repository, so the same exact commit is re-attached to a named
      # branch. No commit, tree or index content changes, and nothing is pushed.
      - name: Normalize checkout to a named branch
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          New-Item -ItemType Directory -Force -Path 'artifacts/ci' | Out-Null
          $headBefore = (git rev-parse HEAD).Trim()
          $refBefore = (git rev-parse --abbrev-ref HEAD).Trim()
          $dirtyBefore = @(git status --porcelain).Count
          git checkout -B "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { Write-Error 'git checkout -B failed'; exit 1 }
          $headAfter = (git rev-parse HEAD).Trim()
          $branchAfter = (git branch --show-current).Trim()
          $dirtyAfter = @(git status --porcelain).Count
          @(
            "trigger_ref=$env:GITHUB_REF",
            "trigger_ref_name=$env:GITHUB_REF_NAME",
            "github_sha=$env:GITHUB_SHA",
            "head_before=$headBefore",
            "head_after=$headAfter",
            "symbolic_ref_before=$refBefore",
            "branch_after=$branchAfter",
            "dirty_files_before=$dirtyBefore",
            "dirty_files_after=$dirtyAfter"
          ) | Tee-Object -FilePath 'artifacts/ci/checkout-state.txt'
          if ($headAfter -ne $env:GITHUB_SHA) { Write-Error 'HEAD does not equal GITHUB_SHA'; exit 1 }
          if ($branchAfter -ne $env:GITHUB_REF_NAME) { Write-Error 'branch does not equal GITHUB_REF_NAME'; exit 1 }
          if ($dirtyAfter -ne 0) { Write-Error 'worktree is not clean after normalization'; exit 1 }

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Report environment fingerprint
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          [Environment]::OSVersion
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture

      - name: Install locked dependencies
        run: npm ci

      # npm 11 may skip Electron's postinstall, and the packaged smoke fails closed without a
      # real runtime. Bounded retry with an explicit non-zero exit; no third-party action.
      - name: Install the pinned Electron runtime
        shell: pwsh
        run: |
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "electron install attempt $attempt of 3 failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error 'Electron runtime install failed after 3 attempts'; exit 1 }
          $pathFile = 'node_modules/electron/path.txt'
          if (-not (Test-Path $pathFile)) { Write-Error "Electron runtime is not installed: $pathFile missing"; exit 1 }
          $binary = (Get-Content $pathFile -Raw).Trim()
          if (-not (Test-Path (Join-Path 'node_modules/electron/dist' $binary))) {
            Write-Error "Electron runtime dist is incomplete: $binary missing"; exit 1
          }
          Write-Host "Electron runtime ready: $binary"

      # Informational only. The product's own resolveWindowsGitInstallation(), exercised by
      # `npm run check` and the packaged smoke, is the single Git contract gate. This step records
      # host facts for the report: it decides nothing, never fails the job, and never injects an
      # override. A second copy of the fingerprint rule here would only drift from the product.
      - name: Record native Git for Windows diagnostics
        id: gitdiag
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          New-Item -ItemType Directory -Force -Path 'artifacts/ci' | Out-Null
          $lines = [System.Collections.Generic.List[string]]::new()
          function Note([string]$text) { $lines.Add($text); Write-Host $text }

          function Get-CandidateRoot([string]$gitExe) {
            if ([string]::IsNullOrWhiteSpace($gitExe)) { return $null }
            $resolved = $gitExe.Trim()
            if ($resolved -notmatch '(?i)^[a-z]:[\\/]') { return $null }
            $directory = Split-Path -Parent $resolved
            if ([string]::IsNullOrWhiteSpace($directory)) { return $null }
            $leaf = Split-Path -Leaf $directory
            if ($leaf -ieq 'cmd' -or $leaf -ieq 'bin') { return (Split-Path -Parent $directory) }
            if ($leaf -ieq 'mingw64' -or $leaf -ieq 'mingw32') { return (Split-Path -Parent (Split-Path -Parent $directory)) }
            return (Split-Path -Parent $directory)
          }

          $candidates = [System.Collections.Generic.List[string]]::new()
          function Add-Candidate([string]$root) {
            if ([string]::IsNullOrWhiteSpace($root)) { return }
            try { $full = [System.IO.Path]::GetFullPath($root).TrimEnd([char]'\') } catch { return }
            if ([string]::IsNullOrWhiteSpace($full) -or $full -match '^[a-z]:$') { return }
            if (-not $candidates.Contains($full)) { [void]$candidates.Add($full) }
          }

          Note '# NovaWing Phase 6A - Windows native Git diagnostics'
          Note '# Informational only. The product resolver is the gate; this step decides nothing.'
          Note "github_sha=$env:GITHUB_SHA"
          Note "os=$([Environment]::OSVersion.VersionString)"
          Note "arch=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"

          $command = Get-Command git -ErrorAction SilentlyContinue
          Note "git_command=$($command.Source)"
          $whereOut = @(& where.exe git 2>&1)
          $whereText = ($whereOut | ForEach-Object { [string]$_ }) -join ','
          Note "git_where=$whereText"
          $gitVersion = ((& git --version 2>&1) -join ' ').Trim()
          Note "git_version=$gitVersion"

          foreach ($hive in @('HKLM:\SOFTWARE\GitForWindows', 'HKCU:\SOFTWARE\GitForWindows')) {
            $label = if ($hive -like 'HKLM*') { 'HKLM' } else { 'HKCU' }
            if (Test-Path $hive) {
              $installPath = (Get-ItemProperty -Path $hive -Name InstallPath -ErrorAction SilentlyContinue).InstallPath
              Note "registry_${label}=present"
              Note "registry_${label}_install_path=$installPath"
            } else {
              Note "registry_${label}=absent"
            }
          }

          Add-Candidate (Get-CandidateRoot $command.Source)
          foreach ($entry in $whereOut) { Add-Candidate (Get-CandidateRoot ([string]$entry)) }
          foreach ($hive in @('HKLM:\SOFTWARE\GitForWindows', 'HKCU:\SOFTWARE\GitForWindows')) {
            if (Test-Path $hive) { Add-Candidate ((Get-ItemProperty -Path $hive -Name InstallPath -ErrorAction SilentlyContinue).InstallPath) }
          }
          foreach ($base in @($env:ProgramW6432, $env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\Program Files', $env:LOCALAPPDATA)) {
            if ($base) { Add-Candidate (Join-Path $base 'Git') }
          }
          Note "candidate_roots=$(($candidates | ForEach-Object { $_ }) -join ',')"

          # Probe the first complete layout and record its raw identity. No verdict is recorded here.
          $probed = $false
          foreach ($root in $candidates) {
            $bash = Join-Path $root 'bin\bash.exe'
            $git = Join-Path $root 'cmd\git.exe'
            $msys = Join-Path $root 'usr\bin\msys-2.0.dll'
            $bashOk = Test-Path -LiteralPath $bash
            $gitOk = Test-Path -LiteralPath $git
            $msysOk = Test-Path -LiteralPath $msys
            Note "candidate $root : bin/bash.exe=$bashOk cmd/git.exe=$gitOk usr/bin/msys-2.0.dll=$msysOk"
            if ($probed -or -not ($bashOk -and $gitOk -and $msysOk)) { continue }
            $probed = $true
            $probeText = ((& $bash --noprofile --norc -c 'printf "%s|%s|%s" "$BASH_VERSION" "$MSYSTEM" "$OSTYPE"' 2>&1) -join ' ').Trim()
            $probeGit = ((& $git --version 2>&1) -join ' ').Trim()
            Note "bash_probe_path=$bash"
            Note "bash_fingerprint=$probeText"
            Note "cmd_git_version=$probeGit"
          }
          if (-not $probed) { Note 'bash_fingerprint=(no candidate had bash.exe, cmd/git.exe and msys-2.0.dll)' }

          $lines | Set-Content -LiteralPath 'artifacts/ci/windows-git-diagnostics.txt' -Encoding utf8

      - name: Validate source, build and host gates
        id: check
        run: npm run check

      - name: Build the Windows unpacked package
        id: packagedir
        run: npm run desktop:package:dir

      # The strict Native Toast gate is deliberately untouched: this job records whether a
      # Windows Server runner satisfies it, rather than weakening it to make the job green.
      - name: Run the packaged Electron smoke
        id: smoke
        run: npm run desktop:package:smoke

      # NSIS is built from the exact `dir` tree the smoke just validated. The adapter refuses to
      # run unless win-unpacked still hashes to the smoke's packageSha256, so the installer can
      # never be produced from a payload other than the one that passed the smoke. Electron
      # Builder is given `prepackaged`, so win-unpacked is read, never recreated.
      - name: Build the Windows NSIS installer
        id: nsis
        run: npm run desktop:build:win

      # The feed the packaged app will actually follow is the file electron-builder burned into it,
      # not the packaging config it was derived from. It must point at the public binary repository,
      # never at the private source repository a client can never authenticate to.
      #
      # This has to run after the NSIS build: electron-builder writes app-update.yml in its
      # afterPack hook only when the build targets a distributable, so the `dir` tree alone never
      # carries it. The NSIS step re-packs that same tree and adds the file to it.
      - name: Verify the packaged Windows update feed
        id: updatefeed
        shell: pwsh
        run: |
          $feedFile = Join-Path 'artifacts/desktop' 'win-unpacked/resources/app-update.yml'
          if (-not (Test-Path -LiteralPath $feedFile)) { Write-Error "Missing packaged update feed: $feedFile"; exit 1 }
          # A flat key/value document, parsed without depending on field order. Any line this
          # cannot read fails the gate rather than being skipped.
          $values = @{}
          foreach ($line in Get-Content -LiteralPath $feedFile) {
            $trimmed = $line.Trim()
            if ($trimmed.Length -eq 0 -or $trimmed.StartsWith('#')) { continue }
            $match = [regex]::Match($trimmed, '^([A-Za-z][A-Za-z0-9_]*):\s*(.*)$')
            if (-not $match.Success) { Write-Error "Unrecognized update feed line: $trimmed"; exit 1 }
            $values[$match.Groups[1].Value] = $match.Groups[2].Value.Trim([char[]]@(32, 34, 39))
          }
          $expected = @{ provider = 'github'; owner = 'weijianjunwjj'; repo = 'nova-wing-releases' }
          foreach ($key in $expected.Keys) {
            if ($values[$key] -ne $expected[$key]) {
              Write-Error "Packaged update feed $key is '$($values[$key])', expected '$($expected[$key])'"; exit 1
            }
          }
          if ($values['repo'] -eq 'nova-wing') { Write-Error 'The packaged update feed still points at the private source repository'; exit 1 }
          Write-Host "WINDOWS_UPDATE_FEED PASS provider=$($values['provider']) owner=$($values['owner']) repo=$($values['repo'])"

      # The update metadata must name the very asset this job produced. electron-builder can write
      # a `path` no release asset carries, and an updater following it would 404.
      - name: Verify the update metadata
        id: updatemetadata
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $installerRecord = Get-Content -LiteralPath 'artifacts/desktop/installer.json' -Raw | ConvertFrom-Json
          # The record carries the absolute path of the packaging workspace. A CI runner directory
          # is not a product identity, so only the leaf name is taken from it, via the path API
          # rather than hand-rolled separator handling.
          $installerName = [System.IO.Path]::GetFileName($installerRecord.path)
          $expectedName = "NovaWing-Setup-$($installerRecord.version)-$($installerRecord.arch).exe"
          if ($installerName -ne $expectedName) {
            Write-Error "installer.json names '$installerName', expected the version-driven name '$expectedName'"; exit 1
          }
          $metadataPath = Join-Path 'artifacts/desktop' 'latest.yml'
          $installerPath = Join-Path 'artifacts/desktop' $installerName
          $blockmapPath = Join-Path 'artifacts/desktop' "$installerName.blockmap"
          foreach ($required in @($metadataPath, $installerPath, $blockmapPath)) {
            if (-not (Test-Path -LiteralPath $required)) { Write-Error "Missing update metadata input: $required"; exit 1 }
          }
          node scripts/platform/verify-update-metadata.mjs --metadata $metadataPath --files-dir 'artifacts/desktop' --expect-version $installerRecord.version --expect-path $installerName
          if ($LASTEXITCODE -ne 0) { Write-Error 'latest.yml does not match the artifacts this job produced'; exit 1 }
          Write-Host "UPDATE_METADATA OK $installerName"

      # Reads back what the packaging adapter wrote and fails the job on any drift. The installer
      # audit itself is not re-implemented here: this only asserts the artifact exists and is
      # self-consistent with the installer file and with the smoke-validated package content.
      - name: Verify the installer artifact identity
        id: installeridentity
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $exeCandidates = @(Get-ChildItem -Path 'artifacts/desktop' -Filter '*.exe' -File)
          if ($exeCandidates.Count -ne 1) { Write-Error "Expected exactly one installer in artifacts/desktop, found $($exeCandidates.Count)"; exit 1 }
          $exe = $exeCandidates[0].FullName
          $identityFile = 'artifacts/desktop/installer.json'
          $auditFile = 'artifacts/desktop/packaged-content-audit.json'
          $proofFile = 'artifacts/desktop/package-smoke/result.json'
          foreach ($required in @($exe, $identityFile, $auditFile, $proofFile)) {
            if (-not (Test-Path -LiteralPath $required)) { Write-Error "Missing required artifact: $required"; exit 1 }
          }

          $installer = Get-Content -LiteralPath $identityFile -Raw | ConvertFrom-Json
          $audit = Get-Content -LiteralPath $auditFile -Raw | ConvertFrom-Json
          $proof = Get-Content -LiteralPath $proofFile -Raw | ConvertFrom-Json

          $resolved = (Resolve-Path -LiteralPath $exe).Path
          $size = (Get-Item -LiteralPath $resolved).Length
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          $stream = [System.IO.File]::OpenRead($resolved)
          try { $digest = $hasher.ComputeHash($stream) } finally { $stream.Dispose(); $hasher.Dispose() }
          $exeSha = (($digest | ForEach-Object { $_.ToString('x2') }) -join '')
          $signedText = ([bool]$installer.signed).ToString().ToLowerInvariant()

          # The adapter spreads DESKTOP_IDENTITY into this record, so the application name is
          # carried as `appName`; there is deliberately no separate `productName` key.
          if ([string]$installer.appName -ne 'NovaWing') { Write-Error "installer.json appName is '$($installer.appName)'"; exit 1 }
          $expectedName = "NovaWing-Setup-$($installer.version)-$($installer.arch).exe"
          if ($exeCandidates[0].Name -ne $expectedName) {
            Write-Error "installer filename '$($exeCandidates[0].Name)' does not match the version-driven name '$expectedName'"; exit 1
          }
          if ([string]$installer.arch -ne 'x64') { Write-Error "installer.json arch is $($installer.arch)"; exit 1 }
          if ([int64]$installer.size -ne $size) { Write-Error "installer.json size $($installer.size) does not match the installer file ($size bytes)"; exit 1 }
          if ([string]$installer.sha256 -ne $exeSha) { Write-Error 'installer.json sha256 does not match the installer file'; exit 1 }
          if ($installer.signed -ne $false) { Write-Error "This phase must ship an unsigned installer, but installer.json says signed=$($installer.signed)"; exit 1 }
          if ([string]::IsNullOrWhiteSpace([string]$installer.path)) { Write-Error 'installer.json records no installer path'; exit 1 }
          if ([string]$proof.result -ne 'PASS') { Write-Error "package-smoke result.json is $($proof.result)"; exit 1 }
          if ([string]$audit.sha256 -ne [string]$proof.packageSha256) {
            Write-Error "Packaged content drifted across the installer build: audit=$($audit.sha256) smoke=$($proof.packageSha256)"; exit 1
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('# NovaWing Phase 6B - Windows installer identity')
          $lines.Add("github_sha=$env:GITHUB_SHA")
          $lines.Add("installer_filename=$($exeCandidates[0].Name)")
          $lines.Add("installer_size=$size")
          $lines.Add("installer_sha256=$exeSha")
          $lines.Add("installer_declared_size=$($installer.size)")
          $lines.Add("installer_declared_sha256=$($installer.sha256)")
          $lines.Add("installer_signed=$signedText")
          $lines.Add("installer_app_name=$($installer.appName)")
          $lines.Add("installer_version=$($installer.version)")
          $lines.Add("installer_arch=$($installer.arch)")
          $lines.Add("installer_electron=$($installer.electron)")
          $lines.Add("installer_builder=$($installer.builder)")
          $lines.Add("package_sha256=$($proof.packageSha256)")
          $lines.Add("package_smoke_result=$($proof.result)")
          $lines.Add("package_content_sha256=$($audit.sha256)")
          New-Item -ItemType Directory -Force -Path 'artifacts/ci' | Out-Null
          $lines | Set-Content -LiteralPath 'artifacts/ci/windows-installer-identity.txt' -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Evidence inventory
        if: always()
        shell: pwsh
        run: |
          foreach ($relative in @('artifacts/ci', 'artifacts/desktop', 'artifacts/desktop/package-smoke')) {
            Write-Host "--- $relative ---"
            if (Test-Path $relative) {
              Get-ChildItem -File $relative -ErrorAction SilentlyContinue |
                ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }
            } else {
              Write-Host '(absent)'
            }
          }

      # The distributable itself. win-unpacked is still never uploaded: the installer, its audit
      # and the smoke evidence are the record, and the multi-hundred-MB tree is not.
      - name: Upload the Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-windows-x64-nsis
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/desktop/*.exe
            artifacts/desktop/installer.json
            artifacts/desktop/packaged-content-audit.json
            artifacts/desktop/latest.yml
            artifacts/desktop/*.blockmap

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-windows-x64-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**
            artifacts/desktop/package-smoke/**

      - name: Job summary
        if: always()
        shell: pwsh
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PACKAGE_OUTCOME: ${{ steps.packagedir.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NSIS_OUTCOME: ${{ steps.nsis.outcome }}
          IDENTITY_OUTCOME: ${{ steps.installeridentity.outcome }}
        run: |
          function Field([string]$path, [string]$key) {
            $value = 'NOT_AVAILABLE'
            try {
              if (Test-Path -LiteralPath $path) {
                $match = Select-String -Path $path -Pattern ('^' + [regex]::Escape($key) + '=(.*)$') | Select-Object -First 1
                if ($match) { $value = $match.Matches[0].Groups[1].Value }
              }
            } catch { $value = 'NOT_AVAILABLE' }
            return $value
          }
          $gate = 'NOT_AVAILABLE'
          $native = 'NOT_AVAILABLE'
          $branch = 'NOT_AVAILABLE'
          $gitBashIdentity = 'NOT_AVAILABLE'
          $gitVersionText = 'NOT_AVAILABLE'
          $proofSha = 'NOT_AVAILABLE'
          try {
            if (Test-Path 'artifacts/desktop/package-smoke/result.json') {
              $proof = Get-Content 'artifacts/desktop/package-smoke/result.json' -Raw | ConvertFrom-Json
              $gate = $proof.nativeNotificationGate
              $proofSha = $proof.packageSha256
            }
          } catch { $gate = 'NOT_AVAILABLE' }
          try {
            if (Test-Path 'artifacts/desktop/package-smoke/native-notification-result.json') {
              $native = (Get-Content 'artifacts/desktop/package-smoke/native-notification-result.json' -Raw | ConvertFrom-Json).result
            }
          } catch { $native = 'NOT_AVAILABLE' }
          try {
            if (Test-Path 'artifacts/ci/checkout-state.txt') {
              $match = Select-String -Path 'artifacts/ci/checkout-state.txt' -Pattern '^branch_after=(.*)$' | Select-Object -First 1
              if ($match) { $branch = $match.Matches[0].Groups[1].Value }
            }
          } catch { $branch = 'NOT_AVAILABLE' }
          try {
            if (Test-Path 'artifacts/ci/windows-git-diagnostics.txt') {
              $identity = Select-String -Path 'artifacts/ci/windows-git-diagnostics.txt' -Pattern '^bash_fingerprint=(.*)$' | Select-Object -First 1
              if ($identity) { $gitBashIdentity = $identity.Matches[0].Groups[1].Value }
              $version = Select-String -Path 'artifacts/ci/windows-git-diagnostics.txt' -Pattern '^git_version=(.*)$' | Select-Object -First 1
              if ($version) { $gitVersionText = $version.Matches[0].Groups[1].Value }
            }
          } catch { }
          $identityPath = 'artifacts/ci/windows-installer-identity.txt'
          @(
            '## NovaWing Phase 6B - windows-build',
            '',
            '| Item | Result |',
            '| --- | --- |',
            '| Runner | windows-2022 / x64 (Windows Server SKU) |',
            ('| Commit SHA | ' + $env:GITHUB_SHA + ' |'),
            ('| Named branch | ' + $branch + ' |'),
            ('| Git version | ' + $gitVersionText + ' |'),
            ('| Git bash identity | ' + $gitBashIdentity + ' |'),
            ('| `npm run check` | ' + $env:CHECK_OUTCOME + ' |'),
            ('| `desktop:package:dir` | ' + $env:PACKAGE_OUTCOME + ' |'),
            ('| `desktop:package:smoke` | ' + $env:SMOKE_OUTCOME + ' |'),
            ('| Native Notification gate | ' + $gate + ' |'),
            ('| Native Notification run | ' + $native + ' |'),
            ('| `desktop:build:win` | ' + $env:NSIS_OUTCOME + ' |'),
            ('| Installer identity check | ' + $env:IDENTITY_OUTCOME + ' |'),
            ('| Installer file | ' + (Field $identityPath 'installer_filename') + ' |'),
            ('| Installer size (bytes) | ' + (Field $identityPath 'installer_size') + ' |'),
            ('| Installer SHA256 | ' + (Field $identityPath 'installer_sha256') + ' |'),
            ('| Installer signed | ' + (Field $identityPath 'installer_signed') + ' |'),
            ('| Package content SHA256 | ' + (Field $identityPath 'package_content_sha256') + ' |'),
            ('| packageSha256 (smoke) | ' + $proofSha + ' |'),
            ('| Smoke result | ' + (Field $identityPath 'package_smoke_result') + ' |'),
            '',
            'The installer is **unsigned** (`signed=false`): no Windows code-signing identity exists',
            'here, and no signing step was added. Windows toasts deliver without one, so the strict',
            'Native Toast gate ran for real and was not weakened, skipped or mocked.',
            '',
            'The NSIS container hash is expected to change between runs. The identity that must hold',
            'is the packaged content: the installer was built from the exact win-unpacked tree whose',
            'packageSha256 the smoke validated, and that equality is asserted above.',
            '',
            'WINDOWS_EBUSY_CLEANUP_NOISE: transient EBUSY cleanup warnings are still observed on the',
            'Windows runner and remain unassociated with any failing test. They are recorded as-is',
            'and deliberately not fixed in this phase.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  macos-build:
    name: macos-build (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # `ref: ${{ github.sha }}` deliberately checks out a detached HEAD. NovaWing inspects the
      # working copy as a normal repository, so the same exact commit is re-attached to a named
      # branch. No commit, tree or index content changes, and nothing is pushed.
      - name: Normalize checkout to a named branch
        shell: bash
        run: |
          mkdir -p artifacts/ci
          head_before="$(git rev-parse HEAD)"
          ref_before="$(git rev-parse --abbrev-ref HEAD)"
          dirty_before="$(git status --porcelain | wc -l | tr -d ' ')"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          head_after="$(git rev-parse HEAD)"
          branch_after="$(git branch --show-current)"
          dirty_after="$(git status --porcelain | wc -l | tr -d ' ')"
          {
            echo "trigger_ref=$GITHUB_REF"
            echo "trigger_ref_name=$GITHUB_REF_NAME"
            echo "github_sha=$GITHUB_SHA"
            echo "head_before=$head_before"
            echo "head_after=$head_after"
            echo "symbolic_ref_before=$ref_before"
            echo "branch_after=$branch_after"
            echo "dirty_files_before=$dirty_before"
            echo "dirty_files_after=$dirty_after"
          } | tee artifacts/ci/checkout-state.txt
          if [ "$head_after" != "$GITHUB_SHA" ]; then
            echo "::error::HEAD does not equal GITHUB_SHA"; exit 1
          fi
          if [ "$branch_after" != "$GITHUB_REF_NAME" ]; then
            echo "::error::branch does not equal GITHUB_REF_NAME"; exit 1
          fi
          if [ "$dirty_after" != "0" ]; then
            echo "::error::worktree is not clean after normalization"; exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The packaging adapter asserts arm64 and audits for darwin-arm64 Codex and libSQL, so an
      # Intel runner is not an equivalent substitute. Refuse it before spending build time.
      - name: Report environment fingerprint
        shell: bash
        run: |
          sw_vers
          uname -m
          node --version
          npm --version
          git --version
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "::error::Expected an arm64 host, got $arch"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Electron runtime
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then ok=1; break; fi
            echo "::warning::electron install attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Electron runtime install failed after 3 attempts"
            exit 1
          fi
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "::error::Electron runtime is not installed: node_modules/electron/path.txt missing"
            exit 1
          fi
          binary="$(cat node_modules/electron/path.txt)"
          if [ ! -e "node_modules/electron/dist/$binary" ]; then
            echo "::error::Electron runtime dist is incomplete: $binary missing"
            exit 1
          fi
          echo "Electron runtime ready: $binary"

      - name: Validate source, build and host gates
        id: check
        run: npm run check

      - name: Build the macOS application bundle
        id: apppackage
        run: npm run desktop:package:mac

      # No Developer ID identity exists, so the adapter reports NEEDS_SIGNED_VALIDATION and the
      # smoke classifies that run from refusal evidence. Every other gate runs for real.
      - name: Run the packaged Electron smoke
        id: smoke
        run: npm run desktop:package:smoke

      # The DMG and ZIP are built by the product's own distribution path from the same staged
      # tree, then audited. No real Codex task is run on the runner.
      - name: Build the macOS distribution artifacts
        id: dist
        run: npm run desktop:package:mac:dist

      # An unreadable image would be a broken distributable, so a non-zero exit from hdiutil
      # fails the job. The shell already runs with `-e`, so no exit code is discarded.
      - name: Verify the DMG image
        id: dmgverify
        shell: bash
        run: |
          dmg="$(ls artifacts/desktop/*.dmg)"
          if [ ! -f "$dmg" ]; then
            echo "::error::DMG is missing: $dmg"
            exit 1
          fi
          /usr/bin/hdiutil verify "$dmg"
          echo "HDIUTIL_VERIFY PASS: $dmg"

      # The update metadata must name the very assets this job produced.
      - name: Verify the update metadata
        id: updatemetadata
        shell: bash
        run: |
          version="$(node -e "process.stdout.write(require('./artifacts/desktop/macos-distribution.json').version)")"
          zip="$(node -e "process.stdout.write(require('./artifacts/desktop/macos-distribution.json').zip.filename)")"
          dmg="$(node -e "process.stdout.write(require('./artifacts/desktop/macos-distribution.json').dmg.filename)")"
          node scripts/platform/verify-update-metadata.mjs \
            --metadata artifacts/desktop/latest-mac.yml --files-dir artifacts/desktop \
            --expect-version "$version" --expect-path "$zip" --expect-path "$dmg"
          for blockmap in "artifacts/desktop/$zip.blockmap" "artifacts/desktop/$dmg.blockmap"; do
            if [ ! -f "$blockmap" ]; then echo "::error::Missing blockmap: $blockmap"; exit 1; fi
          done
          echo "UPDATE_METADATA OK $zip $dmg"

      # Reads back macos-distribution.json and fails the job on any drift. The packaging audit is
      # not re-implemented: this asserts the containers exist, that the recorded hash and size are
      # the real file's, and that the payload is bit-for-bit the one the smoke accepted.
      - name: Verify the distribution artifact identity
        id: distidentity
        shell: bash
        run: |
          mkdir -p artifacts/ci
          node --input-type=commonjs -e '
            const assert = require("node:assert/strict")
            const { createHash } = require("node:crypto")
            const fs = require("node:fs")
            const dist = JSON.parse(fs.readFileSync("artifacts/desktop/macos-distribution.json", "utf8"))
            const proof = JSON.parse(fs.readFileSync("artifacts/desktop/package-smoke/result.json", "utf8"))
            const digest = (p) => createHash("sha256").update(fs.readFileSync(p)).digest("hex")
            const expected = { dmg: `NovaWing-${dist.version}-${dist.arch}.dmg`, zip: `NovaWing-${dist.version}-${dist.arch}-mac.zip` }
            for (const key of Object.keys(expected)) {
              const entry = dist[key]
              assert.ok(entry, `macos-distribution.json records no ${key}`)
              assert.equal(entry.filename, expected[key], `Unexpected ${key} filename: ${entry.filename}`)
              assert.equal(entry.size, fs.statSync(entry.path).size, `${key} size does not match the file on disk`)
              assert.equal(entry.sha256, digest(entry.path), `${key} sha256 does not match the file on disk`)
            }
            assert.equal(proof.result, "PASS", `package-smoke result.json is ${proof.result}`)
            assert.equal(dist.bundleContentSha256, proof.packageSha256,
              `Distribution payload is not the smoke-validated package: ${dist.bundleContentSha256} vs ${proof.packageSha256}`)
            assert.equal(dist.signing.signedForDistribution, false, "This phase must ship an unsigned bundle")
            assert.equal(dist.signing.authority, null, `Unexpected signing authority: ${dist.signing.authority}`)
            assert.equal(dist.nativeNotificationGate, "NEEDS_SIGNED_VALIDATION",
              `An unsigned bundle must not claim a delivery gate: ${dist.nativeNotificationGate}`)
            const lines = [
              "# NovaWing Phase 6B - macOS distribution identity",
              `github_sha=${process.env.GITHUB_SHA}`,
              `dist_version=${dist.version}`,
              `dist_arch=${dist.arch}`,
              `dmg_filename=${dist.dmg.filename}`,
              `dmg_size=${dist.dmg.size}`,
              `dmg_sha256=${dist.dmg.sha256}`,
              `zip_filename=${dist.zip.filename}`,
              `zip_size=${dist.zip.size}`,
              `zip_sha256=${dist.zip.sha256}`,
              `bundle_content_sha256=${dist.bundleContentSha256}`,
              `package_sha256=${proof.packageSha256}`,
              `package_smoke_result=${proof.result}`,
              `notification_gate=${dist.nativeNotificationGate}`,
              `signing_authority=${dist.signing.authority === null ? "NONE" : dist.signing.authority}`,
              `signing_adhoc=${dist.signing.adhoc}`,
              `signing_signed_for_distribution=${dist.signing.signedForDistribution}`,
            ]
            fs.writeFileSync("artifacts/ci/macos-distribution-identity.txt", lines.join("\n") + "\n")
            console.log(lines.join("\n"))
          '

      - name: Evidence inventory
        if: always()
        shell: bash
        run: |
          for relative in artifacts/ci artifacts/desktop artifacts/desktop/package-smoke; do
            echo "--- $relative ---"
            if [ -d "$relative" ]; then
              find "$relative" -maxdepth 1 -type f -exec ls -l {} \; 2>/dev/null || true
            else
              echo '(absent)'
            fi
          done

      # The two containers are uploaded separately so a consumer can take one without pulling the
      # other; each carries the same distribution record. The multi-hundred-MB mac-arm64 tree and
      # the staging copy are not uploaded.
      - name: Upload the macOS DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-macos-arm64-dmg
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.dmg.blockmap
            artifacts/desktop/macos-distribution.json

      - name: Upload the macOS ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-macos-arm64-zip
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/desktop/*-mac.zip
            artifacts/desktop/*-mac.zip.blockmap
            artifacts/desktop/latest-mac.yml
            artifacts/desktop/macos-distribution.json

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-macos-arm64-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**
            artifacts/desktop/package-smoke/**
            artifacts/desktop/macos-packaged-content-audit.json

      - name: Job summary
        if: always()
        shell: bash
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PACKAGE_OUTCOME: ${{ steps.apppackage.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DIST_OUTCOME: ${{ steps.dist.outcome }}
          DMGVERIFY_OUTCOME: ${{ steps.dmgverify.outcome }}
          IDENTITY_OUTCOME: ${{ steps.distidentity.outcome }}
        run: |
          field() {
            found=''
            if [ -f artifacts/ci/macos-distribution-identity.txt ]; then
              found="$(sed -n "s/^$1=//p" artifacts/ci/macos-distribution-identity.txt | head -1)"
            fi
            if [ -n "$found" ]; then printf '%s' "$found"; else printf 'NOT_AVAILABLE'; fi
          }
          branch_after='NOT_AVAILABLE'
          if [ -f artifacts/ci/checkout-state.txt ]; then
            found="$(sed -n 's/^branch_after=//p' artifacts/ci/checkout-state.txt | head -1)"
            if [ -n "$found" ]; then branch_after="$found"; fi
          fi

          {
            echo '## NovaWing Phase 6B - macos-build'
            echo
            echo '| Item | Result |'
            echo '| --- | --- |'
            echo '| Runner | macos-15 / arm64 |'
            printf '| Commit SHA | %s |\n' "$GITHUB_SHA"
            printf '| Named branch | %s |\n' "$branch_after"
            printf '| `npm run check` | %s |\n' "$CHECK_OUTCOME"
            printf '| `desktop:package:mac` | %s |\n' "$PACKAGE_OUTCOME"
            printf '| `desktop:package:smoke` | %s |\n' "$SMOKE_OUTCOME"
            printf '| Smoke result | %s |\n' "$(field package_smoke_result)"
            printf '| `desktop:package:mac:dist` | %s |\n' "$DIST_OUTCOME"
            printf '| `hdiutil verify` | %s |\n' "$DMGVERIFY_OUTCOME"
            printf '| Distribution identity check | %s |\n' "$IDENTITY_OUTCOME"
            printf '| DMG file | %s |\n' "$(field dmg_filename)"
            printf '| DMG size (bytes) | %s |\n' "$(field dmg_size)"
            printf '| DMG SHA256 | %s |\n' "$(field dmg_sha256)"
            printf '| ZIP file | %s |\n' "$(field zip_filename)"
            printf '| ZIP size (bytes) | %s |\n' "$(field zip_size)"
            printf '| ZIP SHA256 | %s |\n' "$(field zip_sha256)"
            printf '| bundleContentSha256 | %s |\n' "$(field bundle_content_sha256)"
            printf '| packageSha256 (smoke) | %s |\n' "$(field package_sha256)"
            printf '| Native Notification gate | %s |\n' "$(field notification_gate)"
            printf '| Signing authority | %s |\n' "$(field signing_authority)"
            printf '| Ad-hoc signature | %s |\n' "$(field signing_adhoc)"
            echo
            echo 'The DMG/ZIP container hashes are expected to change between runs. The identity that'
            echo 'must hold is the payload: bundleContentSha256 equals the packageSha256 the smoke'
            echo 'validated, and that equality is asserted above.'
            echo
            echo 'Developer ID signing: NOT AVAILABLE'
            echo
            echo 'Notarization: NOT PERFORMED'
            echo
            echo 'Native Notification: NEEDS_SIGNED_VALIDATION'
            echo
            echo 'Gatekeeper trusted distribution: NOT CLAIMED'
            echo
            echo 'The bundles are unsigned (ad-hoc at most). This is not a signed release, not'
            echo 'notarized and not intended for trusted distribution. No signing or notarization'
            echo 'step exists in this workflow and none was added.'
          } >> "$GITHUB_STEP_SUMMARY"
