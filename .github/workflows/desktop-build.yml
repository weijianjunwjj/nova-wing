name: Desktop Build

# Phase 6A probe only. This workflow answers whether GitHub-hosted runners can run the
# packaged desktop smoke as it already exists. It builds no installer and creates no release.
on:
  push:
    branches:
      - feat/v0.4-desktop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-probe:
    name: windows-probe (Windows Server 2022 / x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # `ref: ${{ github.sha }}` deliberately checks out a detached HEAD. NovaWing inspects the
      # working copy as a normal repository, so the same exact commit is re-attached to a named
      # branch. No commit, tree or index content changes, and nothing is pushed.
      - name: Normalize checkout to a named branch
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          New-Item -ItemType Directory -Force -Path 'artifacts/ci' | Out-Null
          $headBefore = (git rev-parse HEAD).Trim()
          $refBefore = (git rev-parse --abbrev-ref HEAD).Trim()
          $dirtyBefore = @(git status --porcelain).Count
          git checkout -B "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { Write-Error 'git checkout -B failed'; exit 1 }
          $headAfter = (git rev-parse HEAD).Trim()
          $branchAfter = (git branch --show-current).Trim()
          $dirtyAfter = @(git status --porcelain).Count
          @(
            "trigger_ref=$env:GITHUB_REF",
            "trigger_ref_name=$env:GITHUB_REF_NAME",
            "github_sha=$env:GITHUB_SHA",
            "head_before=$headBefore",
            "head_after=$headAfter",
            "symbolic_ref_before=$refBefore",
            "branch_after=$branchAfter",
            "dirty_files_before=$dirtyBefore",
            "dirty_files_after=$dirtyAfter"
          ) | Tee-Object -FilePath 'artifacts/ci/checkout-state.txt'
          if ($headAfter -ne $env:GITHUB_SHA) { Write-Error 'HEAD does not equal GITHUB_SHA'; exit 1 }
          if ($branchAfter -ne $env:GITHUB_REF_NAME) { Write-Error 'branch does not equal GITHUB_REF_NAME'; exit 1 }
          if ($dirtyAfter -ne 0) { Write-Error 'worktree is not clean after normalization'; exit 1 }

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Report environment fingerprint
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          [Environment]::OSVersion
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture

      - name: Install locked dependencies
        run: npm ci

      # npm 11 may skip Electron's postinstall, and the packaged smoke fails closed without a
      # real runtime. Bounded retry with an explicit non-zero exit; no third-party action.
      - name: Install the pinned Electron runtime
        shell: pwsh
        run: |
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "electron install attempt $attempt of 3 failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error 'Electron runtime install failed after 3 attempts'; exit 1 }
          $pathFile = 'node_modules/electron/path.txt'
          if (-not (Test-Path $pathFile)) { Write-Error "Electron runtime is not installed: $pathFile missing"; exit 1 }
          $binary = (Get-Content $pathFile -Raw).Trim()
          if (-not (Test-Path (Join-Path 'node_modules/electron/dist' $binary))) {
            Write-Error "Electron runtime dist is incomplete: $binary missing"; exit 1
          }
          Write-Host "Electron runtime ready: $binary"

      # NovaWing requires a real native Git for Windows installation and fails closed without one.
      # This step reproduces that contract exactly and, only when every check passes, points the
      # product's own documented override at the detected bash.exe. The contract is never relaxed.
      - name: Prepare native Git for Windows
        id: nativegit
        shell: pwsh
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          New-Item -ItemType Directory -Force -Path 'artifacts/ci' | Out-Null
          $lines = [System.Collections.Generic.List[string]]::new()
          function Note([string]$text) { $lines.Add($text); Write-Host $text }

          function Get-CandidateRoot([string]$gitExe) {
            if ([string]::IsNullOrWhiteSpace($gitExe)) { return $null }
            $resolved = $gitExe.Trim()
            if ($resolved -notmatch '(?i)^[a-z]:[\\/]') { return $null }
            $directory = Split-Path -Parent $resolved
            if ([string]::IsNullOrWhiteSpace($directory)) { return $null }
            $leaf = Split-Path -Leaf $directory
            if ($leaf -ieq 'cmd' -or $leaf -ieq 'bin') { return (Split-Path -Parent $directory) }
            if ($leaf -ieq 'mingw64' -or $leaf -ieq 'mingw32') { return (Split-Path -Parent (Split-Path -Parent $directory)) }
            return (Split-Path -Parent $directory)
          }

          $candidates = [System.Collections.Generic.List[string]]::new()
          function Add-Candidate([string]$root) {
            if ([string]::IsNullOrWhiteSpace($root)) { return }
            try { $full = [System.IO.Path]::GetFullPath($root).TrimEnd([char]'\') } catch { return }
            if ([string]::IsNullOrWhiteSpace($full) -or $full -match '^[a-z]:$') { return }
            if (-not $candidates.Contains($full)) { [void]$candidates.Add($full) }
          }

          Note '# NovaWing Phase 6A - Windows native Git diagnostics'
          Note "github_sha=$env:GITHUB_SHA"
          Note "os=$([Environment]::OSVersion.VersionString)"
          Note "arch=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"

          $command = Get-Command git -ErrorAction SilentlyContinue
          Note "Get-Command git = $($command.Source)"
          $whereOut = @(& where.exe git 2>&1)
          Note 'where.exe git:'
          foreach ($entry in $whereOut) { Note "  $([string]$entry)" }
          $gitVersion = ((& git --version 2>&1) -join ' ').Trim()
          Note "git --version = $gitVersion"

          foreach ($hive in @('HKLM:\SOFTWARE\GitForWindows', 'HKCU:\SOFTWARE\GitForWindows')) {
            if (Test-Path $hive) {
              $installPath = (Get-ItemProperty -Path $hive -Name InstallPath -ErrorAction SilentlyContinue).InstallPath
              Note "registry $hive = present, InstallPath=$installPath"
            } else {
              Note "registry $hive = absent"
            }
          }

          Add-Candidate (Get-CandidateRoot $command.Source)
          foreach ($entry in $whereOut) { Add-Candidate (Get-CandidateRoot ([string]$entry)) }
          foreach ($hive in @('HKLM:\SOFTWARE\GitForWindows', 'HKCU:\SOFTWARE\GitForWindows')) {
            if (Test-Path $hive) { Add-Candidate ((Get-ItemProperty -Path $hive -Name InstallPath -ErrorAction SilentlyContinue).InstallPath) }
          }
          foreach ($base in @($env:ProgramW6432, $env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\Program Files', $env:LOCALAPPDATA)) {
            if ($base) { Add-Candidate (Join-Path $base 'Git') }
          }

          Note 'candidate roots:'
          foreach ($entry in $candidates) { Note "  $entry" }

          $bashPath = $null
          $acceptedGit = $null
          foreach ($root in $candidates) {
            $bash = Join-Path $root 'bin\bash.exe'
            $git = Join-Path $root 'cmd\git.exe'
            $msys = Join-Path $root 'usr\bin\msys-2.0.dll'
            $bashOk = Test-Path -LiteralPath $bash
            $gitOk = Test-Path -LiteralPath $git
            $msysOk = Test-Path -LiteralPath $msys
            Note "candidate $root : bin/bash.exe=$bashOk cmd/git.exe=$gitOk usr/bin/msys-2.0.dll=$msysOk"
            if (-not ($bashOk -and $gitOk -and $msysOk)) { continue }
            $probeText = ((& $bash --noprofile --norc -c 'printf "%s|%s|%s" "$BASH_VERSION" "$MSYSTEM" "$OSTYPE"' 2>&1) -join ' ').Trim()
            $probeGit = ((& $git --version 2>&1) -join ' ').Trim()
            Note "  bash fingerprint = $probeText"
            Note "  cmd/git --version = $probeGit"
            if ($probeText -notmatch '^[^|]+\|MINGW(?:32|64|ARM64)\|msys$') {
              Note '  REJECTED: bash fingerprint does not satisfy the NovaWing contract'
              continue
            }
            if ($probeGit -notmatch '^git version [\d.]+\.windows\.\d+') {
              Note '  REJECTED: git version is not a native Git for Windows version'
              continue
            }
            $bashPath = $bash
            $acceptedGit = $git
            break
          }

          if ($bashPath) {
            Note "ACCEPTED root bash = $bashPath"
            Note "ACCEPTED root git  = $acceptedGit"
          } else {
            Note 'ACCEPTED root = none'
          }
          $lines | Set-Content -LiteralPath 'artifacts/ci/windows-git-diagnostics.txt' -Encoding utf8

          if (-not $bashPath) {
            Write-Host 'HOSTED_WINDOWS_NATIVE_GIT_CONTRACT_UNAVAILABLE'
            Write-Host '::error::HOSTED_WINDOWS_NATIVE_GIT_CONTRACT_UNAVAILABLE'
            exit 1
          }
          "NOVAWING_GIT_BASH_PATH=$bashPath" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "NOVAWING_GIT_BASH_PATH injected = $bashPath"

      - name: Validate source, build and host gates
        id: check
        run: npm run check

      - name: Build the Windows unpacked package
        id: packagedir
        run: npm run desktop:package:dir

      # The strict Native Toast gate is deliberately untouched: this probe finds out whether a
      # Windows Server runner can satisfy it, rather than weakening it to make the job green.
      - name: Run the packaged Electron smoke
        id: smoke
        run: npm run desktop:package:smoke

      - name: Evidence inventory
        if: always()
        shell: pwsh
        run: |
          foreach ($relative in @('artifacts/ci', 'artifacts/desktop', 'artifacts/desktop/package-smoke')) {
            Write-Host "--- $relative ---"
            if (Test-Path $relative) {
              Get-ChildItem -File $relative -ErrorAction SilentlyContinue |
                ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }
            } else {
              Write-Host '(absent)'
            }
          }

      # Small evidence only. The unpacked package is multi-hundred-MB and is not an output of
      # this probe, so it is never uploaded.
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-windows-x64-probe-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**
            artifacts/desktop/package-smoke/**
            artifacts/desktop/packaged-content-audit.json
            artifacts/desktop/installer.json

      - name: Job summary
        if: always()
        shell: pwsh
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PACKAGE_OUTCOME: ${{ steps.packagedir.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NATIVEGIT_OUTCOME: ${{ steps.nativegit.outcome }}
        run: |
          $gate = 'NOT_AVAILABLE'
          $native = 'NOT_AVAILABLE'
          $branch = 'NOT_AVAILABLE'
          $gitBash = 'NOT_AVAILABLE'
          try {
            if (Test-Path 'artifacts/desktop/package-smoke/result.json') {
              $gate = (Get-Content 'artifacts/desktop/package-smoke/result.json' -Raw | ConvertFrom-Json).nativeNotificationGate
            }
          } catch { $gate = 'NOT_AVAILABLE' }
          try {
            if (Test-Path 'artifacts/desktop/package-smoke/native-notification-result.json') {
              $native = (Get-Content 'artifacts/desktop/package-smoke/native-notification-result.json' -Raw | ConvertFrom-Json).result
            }
          } catch { $native = 'NOT_AVAILABLE' }
          try {
            if (Test-Path 'artifacts/ci/checkout-state.txt') {
              $match = Select-String -Path 'artifacts/ci/checkout-state.txt' -Pattern '^branch_after=(.*)$' | Select-Object -First 1
              if ($match) { $branch = $match.Matches[0].Groups[1].Value }
            }
          } catch { $branch = 'NOT_AVAILABLE' }
          if ($env:NOVAWING_GIT_BASH_PATH) { $gitBash = $env:NOVAWING_GIT_BASH_PATH }
          @(
            '## NovaWing Phase 6A - windows-probe',
            '',
            '| Item | Result |',
            '| --- | --- |',
            '| Runner | windows-2022 / x64 (Windows Server SKU) |',
            ('| Named branch | ' + $branch + ' |'),
            ('| Native Git for Windows | ' + $env:NATIVEGIT_OUTCOME + ' |'),
            ('| NOVAWING_GIT_BASH_PATH | ' + $gitBash + ' |'),
            ('| `npm run check` | ' + $env:CHECK_OUTCOME + ' |'),
            ('| `desktop:package:dir` | ' + $env:PACKAGE_OUTCOME + ' |'),
            ('| `desktop:package:smoke` | ' + $env:SMOKE_OUTCOME + ' |'),
            ('| Native Notification gate | ' + $gate + ' |'),
            ('| Native Notification run | ' + $native + ' |'),
            '',
            'A failure here is a **hosted runner probe** result, not a regression of the Phase 4',
            'Windows 11 real-host acceptance. The strict Native Toast gate is unchanged and was',
            'not weakened, skipped or mocked.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  macos-probe:
    name: macos-probe (macOS 15 / arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # `ref: ${{ github.sha }}` deliberately checks out a detached HEAD. NovaWing inspects the
      # working copy as a normal repository, so the same exact commit is re-attached to a named
      # branch. No commit, tree or index content changes, and nothing is pushed.
      - name: Normalize checkout to a named branch
        shell: bash
        run: |
          mkdir -p artifacts/ci
          head_before="$(git rev-parse HEAD)"
          ref_before="$(git rev-parse --abbrev-ref HEAD)"
          dirty_before="$(git status --porcelain | wc -l | tr -d ' ')"
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          head_after="$(git rev-parse HEAD)"
          branch_after="$(git branch --show-current)"
          dirty_after="$(git status --porcelain | wc -l | tr -d ' ')"
          {
            echo "trigger_ref=$GITHUB_REF"
            echo "trigger_ref_name=$GITHUB_REF_NAME"
            echo "github_sha=$GITHUB_SHA"
            echo "head_before=$head_before"
            echo "head_after=$head_after"
            echo "symbolic_ref_before=$ref_before"
            echo "branch_after=$branch_after"
            echo "dirty_files_before=$dirty_before"
            echo "dirty_files_after=$dirty_after"
          } | tee artifacts/ci/checkout-state.txt
          if [ "$head_after" != "$GITHUB_SHA" ]; then
            echo "::error::HEAD does not equal GITHUB_SHA"; exit 1
          fi
          if [ "$branch_after" != "$GITHUB_REF_NAME" ]; then
            echo "::error::branch does not equal GITHUB_REF_NAME"; exit 1
          fi
          if [ "$dirty_after" != "0" ]; then
            echo "::error::worktree is not clean after normalization"; exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The packaging adapter asserts arm64 and audits for darwin-arm64 Codex and libSQL, so an
      # Intel runner is not an equivalent substitute. Refuse it before spending build time.
      - name: Report environment fingerprint
        shell: bash
        run: |
          sw_vers
          uname -m
          node --version
          npm --version
          git --version
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "::error::Expected an arm64 host, got $arch"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Electron runtime
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then ok=1; break; fi
            echo "::warning::electron install attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Electron runtime install failed after 3 attempts"
            exit 1
          fi
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "::error::Electron runtime is not installed: node_modules/electron/path.txt missing"
            exit 1
          fi
          binary="$(cat node_modules/electron/path.txt)"
          if [ ! -e "node_modules/electron/dist/$binary" ]; then
            echo "::error::Electron runtime dist is incomplete: $binary missing"
            exit 1
          fi
          echo "Electron runtime ready: $binary"

      - name: Validate source, build and host gates
        id: check
        run: npm run check

      - name: Build the macOS application bundle
        id: apppackage
        run: npm run desktop:package:mac

      # No Developer ID identity exists, so the adapter reports NEEDS_SIGNED_VALIDATION and the
      # smoke classifies that run from refusal evidence. Every other gate runs for real.
      - name: Run the packaged Electron smoke
        id: smoke
        run: npm run desktop:package:smoke

      - name: Evidence inventory
        if: always()
        shell: bash
        run: |
          for relative in artifacts/ci artifacts/desktop artifacts/desktop/package-smoke; do
            echo "--- $relative ---"
            if [ -d "$relative" ]; then
              find "$relative" -maxdepth 1 -type f -exec ls -l {} \; 2>/dev/null || true
            else
              echo '(absent)'
            fi
          done

      # No DMG/ZIP in this round: the probe only has to answer whether the hosted runner can run
      # the packaged GUI smoke at all.
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novawing-macos-arm64-probe-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**
            artifacts/desktop/package-smoke/**
            artifacts/desktop/macos-package.json
            artifacts/desktop/macos-packaged-content-audit.json

      - name: Job summary
        if: always()
        shell: bash
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PACKAGE_OUTCOME: ${{ steps.apppackage.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          json_field() {
            node --input-type=commonjs -e "
              const fs = require('fs')
              try {
                const doc = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'))
                const value = process.argv[2].split('.').reduce((a, k) => (a == null ? a : a[k]), doc)
                process.stdout.write(value == null ? 'NOT_AVAILABLE' : String(value))
              } catch { process.stdout.write('NOT_AVAILABLE') }
            " "$1" "$2"
          }
          gate="$(json_field artifacts/desktop/macos-package.json nativeNotificationGate)"
          authority="$(json_field artifacts/desktop/macos-package.json signing.authority)"
          adhoc="$(json_field artifacts/desktop/macos-package.json signing.adhoc)"
          native="$(json_field artifacts/desktop/package-smoke/native-notification-result.json result)"
          branch_after='NOT_AVAILABLE'
          if [ -f artifacts/ci/checkout-state.txt ]; then
            found="$(sed -n 's/^branch_after=//p' artifacts/ci/checkout-state.txt | head -1)"
            if [ -n "$found" ]; then branch_after="$found"; fi
          fi

          {
            echo '## NovaWing Phase 6A - macos-probe'
            echo
            echo '| Item | Result |'
            echo '| --- | --- |'
            echo '| Runner | macos-15 / arm64 |'
            printf '| Named branch | %s |\n' "$branch_after"
            printf '| `npm run check` | %s |\n' "$CHECK_OUTCOME"
            printf '| `desktop:package:mac` | %s |\n' "$PACKAGE_OUTCOME"
            printf '| `desktop:package:smoke` | %s |\n' "$SMOKE_OUTCOME"
            printf '| Native Notification gate | %s |\n' "$gate"
            printf '| Native Notification run | %s |\n' "$native"
            printf '| Signing authority | %s |\n' "$authority"
            printf '| Ad-hoc signature | %s |\n' "$adhoc"
            echo
            echo 'Developer ID signing: NOT AVAILABLE'
            echo
            echo 'Notarization: NOT PERFORMED'
            echo
            echo 'This artifact is unsigned/ad-hoc. It is not a signed release, not notarized and'
            echo 'not production-signed. A failure here is a hosted runner probe result, not a'
            echo 'regression of the Phase 5 real-host acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
