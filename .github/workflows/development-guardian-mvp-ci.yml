name: Development Guardian MVP CI

on:
  push:
    branches:
      - feat/development-guardian-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows-git-bash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check
