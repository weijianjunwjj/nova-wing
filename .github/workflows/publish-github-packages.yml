name: Publish private GitHub Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer already present in package.json
        required: true
        type: string
      confirmation:
        description: Type publish to authorize this immutable version
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nova-wing-package-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-packages
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 24 and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@weijianjunwjj'

      - name: Validate manual release inputs
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/validate-release-version.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source, build, and existing package contract
        run: |
          npm run typecheck
          npm run build
          npm run check
          npm run pack:check
          npm run consumer:selftest

      - name: Prepare and validate the private release package
        run: |
          npm run release:prepare
          npm run release:inspect
          npm run release:selftest

      - name: Audit locked dependencies
        run: npm audit

      - name: Verify the exact version again
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/validate-release-version.mjs

      - name: Require a clean Git worktree
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish the generated directory to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./release-package --ignore-scripts --registry=https://npm.pkg.github.com
